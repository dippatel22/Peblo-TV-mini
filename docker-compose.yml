services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peblo
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://peblo:peblo@db:5432/peblo
      JWT_SECRET: local-development-secret-change-me
      STORAGE_ROOT: /app/storage
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./backend:/app

  cms:
    build: ./cms
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./cms:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  viewer:
    build: ./viewer
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5174:5174"
    depends_on:
      - api
    volumes:
      - ./viewer:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]

volumes:
  pgdata:
